<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo TriFlow : reprend le style Tridel (tuile brillante, deux flèches opposées, lettres blanches cernées),
       en bleu et orange. Source des icônes PNG (outils/logo.py). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B3F7E"/>
      <stop offset=".42" stop-color="#1F74C8"/>
      <stop offset=".62" stop-color="#F6B13C"/>
      <stop offset="1" stop-color="#F08A1C"/>
    </linearGradient>
    <linearGradient id="cadre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#C9D2DC"/>
      <stop offset="1" stop-color="#6E7A88"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E2520B"/>
    </linearGradient>
    <linearGradient id="bleu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D8EE6"/>
      <stop offset="1" stop-color="#14549E"/>
    </linearGradient>
    <linearGradient id="brillant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tuile"><rect x="22" y="22" width="468" height="468" rx="86"/></clipPath>
  </defs>
  <!-- cadre biseauté -->
  <rect x="8" y="8" width="496" height="496" rx="100" fill="url(#cadre)"/>
  <rect x="22" y="22" width="468" height="468" rx="86" fill="url(#fond)"/>
  <g clip-path="url(#tuile)">
    <!-- flèche du haut (vers la droite), orange -->
    <path d="M150 140 H378 V100 L468 180 L378 260 V220 H150 Z" fill="url(#orange)" stroke="#5A1E00" stroke-width="9" stroke-linejoin="round"/>
    <!-- flèche du bas (vers la gauche), bleue -->
    <path d="M362 300 H134 V260 L44 340 L134 420 V380 H362 Z" fill="url(#bleu)" stroke="#06244A" stroke-width="9" stroke-linejoin="round"/>
    <!-- lettres -->
    <g font-family="Inter, 'Inter Display', 'Arial Black', Arial, sans-serif" font-weight="900" fill="#FFFFFF" stroke="#111111" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
      <text x="52" y="228" font-size="128" letter-spacing="-4">TRI</text>
      <text x="478" y="384" font-size="104" letter-spacing="-5" text-anchor="end">FLOW</text>
    </g>
    <!-- reflet brillant sur la moitié haute -->
    <path d="M22 22 H490 V214 C380 250 150 250 22 206 Z" fill="url(#brillant)"/>
  </g>
</svg>
