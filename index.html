<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TriFlow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1F5C2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TriFlow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Mise en page : bandeau vert avec l'illustration de l'usine (thème du Planning Tridel), navigation dans le bandeau,
   recherche/scan dessous, contenu en liste + fiche. Plaques jaunes = emplacements, étiquettes bleues = repères KKS. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#EAF0EB; --ink:#17211C; --muted:#5E6E64; --line:#E1E8E2;
  --accent:#1F7A4D; --accent-ink:#FFFFFF; --accent-soft:#E7F4EC; --accent-line:#9CCDB2;
  --signal:#E8770F;
  --steel:#1D516B; --steel-soft:#E1ECF1;
  --plate:#F6EFDC; --plate-ink:#5B4718; --plate-line:#E2D3AA;
  --stat:#6B3FA0; --stat-soft:#EFE7F8;
  --ok:#1C6E3E; --ok-soft:#E7F6EC; --warn:#8A5A00; --warn-soft:#FFF3D6; --bad:#C62838; --bad-soft:#FDECEE; --info:#1D516B; --info-soft:#E1ECF1;
  --f-display:"Space Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1512; --surface:#18211C; --sunk:#131B16; --ink:#E7EEE9; --muted:#8A9B91; --line:#26332B;
  --accent:#2AA468; --accent-ink:#06150D; --accent-soft:#163225; --accent-line:#2E6B4B;
  --signal:#F09A47;
  --steel:#8FC3DA; --steel-soft:#16303B;
  --plate:#332C1D; --plate-ink:#E8D7A8; --plate-line:#54482C;
  --stat:#C9A8F0; --stat-soft:#2A1E3A;
  --ok:#7FD8A8; --ok-soft:#16301F; --warn:#F0C860; --warn-soft:#3A3015; --bad:#F0707C; --bad-soft:#3A1A1F; --info:#8FC3DA; --info-soft:#16303B;
  color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
.menu{position:relative;margin-left:auto}
.menu > .btn .chev{width:14px;height:14px;margin-left:-2px;color:var(--muted)}
.menu-list{position:fixed;min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.2);padding:6px;z-index:25;display:flex;flex-direction:column}
.menu-list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:7px;font-size:.92rem;white-space:nowrap}
.menu-list button:hover,.menu-list button:focus-visible{background:var(--sunk)}
.menu-list .ico{width:18px;height:18px;color:var(--muted)}
.menu-list hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:1.7rem}
h2{font-size:1.35rem}
h3{font-size:.95rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
.muted{color:var(--muted)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- Structure ---------- */
.app{max-width:1360px;margin:0 auto;padding-top:16px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.hero{position:relative;overflow:hidden;border-radius:20px;color:#fff;min-height:176px;padding:26px 24px 18px;display:flex;align-items:stretch;
  background:radial-gradient(circle at 100% -10%,rgba(232,119,15,.20),transparent 45%),linear-gradient(135deg,#0E2818,#1F5C2C 55%,#3C8A48 92%);box-shadow:0 1px 2px rgba(16,31,54,.04),0 14px 30px -10px rgba(16,31,54,.18)}
@media (prefers-color-scheme:dark){.hero{background:radial-gradient(circle at 100% -10%,rgba(232,119,15,.16),transparent 45%),linear-gradient(135deg,#08140D,#143A1D 55%,#24592E 95%)}}
.hero-art{position:absolute;inset:0;pointer-events:none}
.hero-art svg{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:none;opacity:.96}
.hero-art::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(9,30,17,.92) 0%,rgba(9,30,17,.66) 34%,rgba(9,30,17,.12) 62%,rgba(9,30,17,0) 80%)}
.hero-stripe{position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#1F5C2C,#5C9A34,#C9A208,#E37817,#D62E15)}
.hero-inner{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:16px;width:100%}
.logo{width:58px;height:58px;object-fit:contain;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4));flex:none}
.hero-copy{min-width:0}
.hero h1{font-size:1.75rem;color:#fff;letter-spacing:-.01em}
.hero p{margin-top:3px;color:#D3E8DB;font-size:.82rem;font-weight:500}
.nav{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(8,28,16,.55);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:9px;font-size:.9rem;font-weight:600;color:#E6F2EA}
.nav button .ico{width:18px;height:18px}
.nav button:hover{background:rgba(255,255,255,.12)}
.nav button[aria-current="page"]{background:#fff;color:#155C39}
.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.content{min-width:0;display:flex;flex-direction:column}
@media (min-width:981px){
  .hero{min-height:0;padding:18px 22px 16px}
  .hero-inner{flex-direction:row;align-items:center;justify-content:flex-start;gap:26px}
  .hero p{display:none}
  .hero h1{font-size:1.5rem}
}
.foot{padding:8px 0 28px;font-size:.78rem;color:var(--muted)}
.topbar{position:sticky;top:0;z-index:15;background:var(--bg);padding-block:12px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:16;background:var(--bg)}
main{min-width:0;padding-block:8px 24px}
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;margin-bottom:14px}
.page-head .tools{flex:1 1 420px;justify-content:flex-end}
.eyebrow{font-size:.76rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:4px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.pane.detail{position:sticky;top:84px;padding:20px;max-height:calc(100vh - 100px);overflow:auto}
#list{overflow:hidden}
#detail{scroll-margin-top:72px}

/* ---------- Recherche globale ---------- */
.gsearch{position:relative;max-width:680px}
.gsearch > .ico{position:absolute;left:14px;top:11px;color:var(--muted);pointer-events:none}
.gsearch input{padding-left:44px;padding-right:44px;min-height:42px;border-radius:999px;background:var(--surface);font-size:.95rem}
.gsearch kbd{position:absolute;right:12px;top:10px;font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--muted)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.18);max-height:70vh;overflow:auto;padding:6px;z-index:30}
.gres h4{margin:8px 10px 4px;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.gres button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:0}
.gres button:hover,.gres button.hot{background:var(--sunk)}
.gres button:focus-visible{outline:2px solid var(--accent)}
.gres .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.gres .r{margin-left:auto;white-space:nowrap}
.gres .none{padding:14px 10px;color:var(--muted)}

/* ---------- Contrôles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:6px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:.9rem;white-space:nowrap}
.btn .ico{width:18px;height:18px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{border-style:dashed;background:transparent;color:var(--accent);border-color:var(--accent-line)}
.btn.danger-ghost{color:var(--bad);background:transparent}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.small{min-height:32px;padding:4px 10px;font-size:.85rem}
.link{all:unset;cursor:pointer;color:var(--steel);font-size:.88rem;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.link .ico{width:16px;height:16px}
.link:hover{text-decoration:underline}
.link.danger{color:var(--bad)}
.link:focus-visible{outline:2px solid var(--accent)}
.icon-btn{all:unset;cursor:pointer;width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r);color:var(--muted);font-size:1.25rem;line-height:1}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
input,select,textarea{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-height:38px}
input:focus,select:focus,textarea:focus{border-color:var(--accent-line);outline:2px solid var(--accent-soft);outline-offset:0}
textarea{resize:vertical;line-height:1.45}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--accent);outline:none}
.search{flex:1 1 220px;max-width:320px;width:auto}
.toggle{display:inline-flex;flex-direction:row;gap:7px;align-items:center;font-size:.9rem;white-space:nowrap;cursor:pointer;color:var(--ink);font-weight:400}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:500;color:var(--muted)}
label > input,label > select,label > textarea{color:var(--ink);font-weight:400;font-size:.95rem}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{font-size:.85rem;font-weight:600;padding:0 4px;color:var(--muted)}
.hint{font-size:.82rem;color:var(--muted)}
select.mini{width:auto;min-height:36px;font-size:.88rem}

/* ---------- Plaques & puces ---------- */
.plate{all:unset;display:inline-block;font-family:var(--f-mono);font-weight:600;font-size:.82rem;letter-spacing:.02em;background:var(--plate);color:var(--plate-ink);border:1px solid var(--plate-line);border-radius:3px;padding:1px 6px;white-space:nowrap;line-height:1.5}
button.plate{cursor:pointer}
button.plate:hover{box-shadow:0 0 0 2px var(--plate-line)}
button.plate:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat{all:unset;display:inline-flex;align-items:center;gap:5px;font-size:.82rem;font-weight:600;color:var(--stat);background:var(--stat-soft);border:1px dashed var(--stat);border-radius:999px;padding:1px 10px 1px 7px;white-space:nowrap;line-height:1.5}
.stat .ico{width:14px;height:14px}
button.stat{cursor:pointer}
button.stat:hover{border-style:solid}
button.stat:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stat.big{font-size:1.1rem;padding:4px 14px 4px 10px}
.stat.big .ico{width:18px;height:18px}
.stat-head{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;background:var(--stat-soft);color:var(--ink);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stat-head .ico{color:var(--stat);margin-top:2px}
.stat-head strong{display:block;color:var(--stat)}
.stat-head span{font-size:.85rem;color:var(--muted)}
.room.is-stat .slot{border-style:dashed;border-color:var(--stat);color:var(--stat)}
.plate.big{font-size:1.5rem;padding:4px 12px;border-width:2px;border-radius:4px}
.kks{all:unset;display:inline-block;font-family:var(--f-mono);font-weight:500;font-size:.82rem;border:1.5px solid var(--steel);color:var(--steel);border-radius:3px;padding:0 6px;white-space:nowrap;line-height:1.55;background:var(--surface)}
button.kks{cursor:pointer}
button.kks:hover{background:var(--steel-soft)}
button.kks:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kks.big{font-size:1.15rem;padding:2px 10px}
.ref{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-weight:500}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
.chip .ico{width:14px;height:14px}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.off{background:var(--sunk);color:var(--muted)}
.chip.fire{background:var(--accent-soft);color:var(--accent)}
.zone-tag{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--muted)}
.zone-tag .ico{width:15px;height:15px}
.qty{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.qty.low{color:var(--warn)}
.qty.big{font-size:1.3rem}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);vertical-align:middle;margin-left:6px}

/* ---------- Tableaux ---------- */
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr[data-act]{cursor:pointer}
.tbl tr[data-act]:hover td{background:var(--sunk)}
.tbl tr.sel td{background:var(--accent-soft)}
.tbl tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.tbl tr[data-act]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tbl .num{text-align:right}
.tbl.compact td,.tbl.compact th{padding:7px 10px}
.tbl .des{font-weight:500;display:block}
.tbl .sub{display:block;font-size:.8rem;color:var(--muted)}
.tbl .grp th{background:var(--sunk);color:var(--ink);font-family:var(--f-display);font-size:.95rem;letter-spacing:.04em;text-transform:none;padding:8px 12px}
.tbl .grp th span{display:inline-flex;align-items:center;gap:8px}
.tbl .grp th .ico{color:var(--steel)}
.places{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.row-tools{text-align:right;white-space:nowrap}
.row-tools > * + *{margin-left:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:1.02rem;margin-bottom:4px}
.empty-line{color:var(--muted);font-size:.9rem;padding:6px 0}

/* ---------- Fiche ---------- */
.d-head{display:flex;flex-direction:column;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.d-title{min-width:0;display:flex;flex-direction:column;gap:5px}
.d-title h2{font-size:1.55rem}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.d-actions .links{display:flex;gap:14px;margin-left:auto}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 18px;margin:16px 0}
.facts dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.facts dd{margin:3px 0 0;min-width:0}
.facts .wide{grid-column:1/-1}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 14px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:.9rem;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:2px solid var(--accent)}
.tabs .n{font-family:var(--f-mono);font-size:.74rem;margin-left:5px}
.tabpanel{display:flex;flex-direction:column;gap:12px}
.block{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.kks-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.kks-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.kks-list li .sub{display:block;font-size:.78rem;color:var(--muted)}
.inline-form{display:flex;gap:8px}
.inline-form input{flex:1;min-width:0}
.placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);padding:48px 16px;max-width:36ch;margin:0 auto}
.placeholder .ico{width:40px;height:40px;opacity:.5}
.side-qr{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:16px;align-items:start}
.qr-box{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.qr-box .qr{width:120px;height:120px;background:#fff;padding:7px;border:1px solid var(--line);border-radius:8px}
.qr-box figcaption{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);overflow-wrap:anywhere;text-align:center}
.qr svg{display:block;width:100%;height:100%}

/* ---------- Emplacements ---------- */
.room{border-bottom:1px solid var(--line);padding:14px 16px}
.room:last-child{border-bottom:0}
.room-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.room-head strong{font-weight:600}
.rack{margin-top:10px;padding-left:12px;border-left:2px solid var(--line)}
.rack-head{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-bottom:6px}
.slots{display:flex;flex-wrap:wrap;gap:5px}
.otree{padding:0 18px 14px 44px}
.rack .rack{margin-top:6px}
.rack-head .slot{font-weight:600}
.slot{all:unset;cursor:pointer;font-family:var(--f-mono);font-size:.8rem;padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:inline-flex;gap:6px;align-items:center;min-height:26px}
.slot:hover{border-color:var(--plate-line)}
.slot small{font-size:.68rem;color:var(--muted)}
.slot.filled{background:var(--sunk)}
.slot.sel{background:var(--plate);color:var(--plate-ink);border-color:var(--plate-line)}
.slot.sel small{color:var(--plate-ink)}
.slot:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- Accueil : synoptique & actions rapides ---------- */
.syn{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px;margin-bottom:18px}
.syn-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px;margin-bottom:14px}
.syn-head h2{font-size:1.2rem}
.syn-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr) 26px) minmax(0,1fr);align-items:stretch}
.syn-end{display:grid;grid-template-rows:1fr 1fr;gap:8px}
.arrow{display:grid;place-items:center;color:var(--accent-line)}
.arrow svg{width:22px;height:22px}
.zone{all:unset;cursor:pointer;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-width:0}
.zone:hover{border-color:var(--steel);background:var(--steel-soft)}
.zone:focus-visible{outline:2px solid var(--accent)}

.pd-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.pd-id{font-family:var(--f-mono);font-size:.85rem;font-weight:700;color:var(--muted);background:var(--sunk);padding:3px 10px;border-radius:999px}
.pd-tools{display:flex;gap:6px;align-items:center}
.pd-title{margin:4px 0 2px;font-size:1.35rem;line-height:1.25}
.pd-sub{margin:0 0 12px;color:var(--ink)}
.pd-stock{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:12px;background:var(--accent-soft);margin:10px 0 6px}
.pd-stock.low{background:var(--warn-soft, #FFF4E0)}
.pd-qty{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.pd-qty .n{font-family:var(--f-mono);font-size:2rem;font-weight:700;line-height:1}
.pd-qty .u{font-weight:600}
.pd-qty .l{color:var(--muted);font-size:.85rem}
.pd-sec{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:10px}
.pd-sec h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pd-sec h3 .ico{width:16px;height:16px}
.pd-where{display:flex;flex-direction:column;gap:6px}
.pd-where.out{margin-top:8px}
.pd-loc{display:flex;align-items:center;gap:12px;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.pd-loc .plate,.pd-loc .stat{font-size:1rem}
.pd-loc .t{flex:1;min-width:0;color:var(--muted);font-size:.85rem}
.pd-loc .q{font-family:var(--f-mono);font-weight:700;font-size:1.05rem}
.pd-loc .q small{font-weight:400;color:var(--muted);font-family:inherit}
.pd-kks{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.pd-k{display:flex;align-items:center;gap:10px;padding:4px 0}
.pd-k .t{flex:1;min-width:0;font-size:.9rem}
.pd-info{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0;font-size:.9rem}
.pd-info dt{color:var(--muted)}
.pd-info dd{margin:0;white-space:pre-line}
.pd-info dd.full{grid-column:1 / -1}
.pd-hist{display:flex;flex-direction:column;margin-bottom:8px}
.ph{display:grid;grid-template-columns:5.6em 4em 1fr;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dashed var(--line);font-size:.88rem}
.ph .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.ph .q{font-family:var(--f-mono);font-weight:700;text-align:right}
.ph .q.neg{color:var(--bad)}.ph .q.pos{color:var(--ok)}
.ph .lw{display:block;font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.four-row td:first-child{display:flex;align-items:center;gap:8px}
.four-row .chev{display:inline-flex;color:var(--muted);transition:transform .15s}
.four-row .chev.open{transform:rotate(90deg)}
.four-row.open{background:var(--accent-soft)}
.four-row.open td{font-weight:600}
.four-sub > td{padding:6px 14px 14px 36px !important;background:var(--accent-soft)}
.four-tools{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.four-list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;max-height:420px;overflow-y:auto}
.four-p{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.88rem}
.four-p:last-child{border-bottom:0}
.four-p:hover,.four-p:focus-visible{background:var(--sunk)}
.four-p .pid{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);min-width:3.4em}
.four-p .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.four-p .q{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.four-p .q small{font-weight:400;color:var(--muted)}
.four-p .plate{font-size:.75rem}
.kgroups{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.kgrp{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kgrp.single{border:0}
.kgrp.open{border-color:var(--accent-line, var(--line))}
.kgrp-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:11px 14px;cursor:pointer;color:var(--ink);font:inherit;font-size:.92rem}
.kgrp-h:hover,.kgrp-h:focus-visible{background:var(--accent-soft)}
.kgrp.open .kgrp-h{background:var(--accent-soft);font-weight:600}
.kgrp-h .code{min-width:5.4em}
.kgrp-h .t{flex:1;min-width:0}
.kgrp-h .cnt{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.kgrp-h .chev{display:inline-flex;color:var(--muted);transition:transform .15s}
.kgrp-h .chev.open{transform:rotate(90deg)}
.kgrp .chip{font-size:.72rem}
.ktype{padding:10px 14px 4px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.kgrp .tbl-wrap{border:0}
.sys-kids{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.sys-kid{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper, transparent);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink);font:inherit}
.sys-kid:hover,.sys-kid:focus-visible{border-color:var(--accent);background:var(--accent-soft)}
.sys-kid .code{min-width:2.6em}
.sys-kid .t{flex:1;min-width:0}
.sys-kid .cnt{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.sys-kid .ico{color:var(--muted)}
.sys-head .cnt{margin-left:auto;font-family:var(--f-mono);color:var(--muted)}
.btn.back{margin-bottom:12px}
.btn.back .ico{transform:rotate(180deg)}
.rtools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .c{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 12px;font-size:.88rem;background:var(--bg)}
.chips .c .icon-btn{width:24px;height:24px;font-size:1rem}
.lists{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.lists > div{display:flex;flex-direction:column;gap:10px}

/* ---------- Dialogues ---------- */
dialog.dlg{width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 32px);padding:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog.dlg.wide{width:min(860px,calc(100vw - 24px))}
dialog.dlg::backdrop{background:rgba(12,18,21,.55)}
.dlg form{display:flex;flex-direction:column;max-height:calc(100vh - 34px)}
.dlg header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dlg-body{padding:16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.dlg footer .left{margin-right:auto}
.dlg-err{margin:0 20px 4px;padding:8px 12px;border-radius:var(--r);background:var(--bad-soft);color:var(--bad);font-size:.9rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 9px;color:var(--ink);font-weight:400;cursor:pointer}
.checks label:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line)}
.seg{flex-direction:row;flex-wrap:wrap;gap:6px;border:0;padding:0}
.seg label{flex-direction:row;align-items:center;gap:6px;border:1px solid var(--line);border-radius:var(--r);padding:7px 12px;color:var(--ink);cursor:pointer;font-weight:500}
.seg label:has(input:checked){background:var(--accent-soft);border-color:var(--accent-line)}
.mvtypes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border:0;padding:0}
.mvt{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:12px 8px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--bg)}
.mvt input{position:absolute;opacity:0;pointer-events:none}
.mvt .qi{width:38px;height:38px;border-radius:10px;background:var(--sunk);color:var(--muted);display:grid;place-items:center}
.mvt strong{font-weight:600;font-size:.95rem}
.mvt small{font-weight:400;font-size:.76rem;color:var(--muted);line-height:1.25}
.mvt:hover{border-color:var(--accent-line)}
.mvt:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.mvt:has(input:checked) .qi{background:var(--accent);color:var(--accent-ink)}
.mvt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.pick-tools{display:flex;gap:8px}
.pick-tools input{flex:1;min-width:0}
.pick-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pick-grp + .pick-grp{border-top:1px solid var(--line)}
.pick-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px 2px;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--muted);position:sticky;top:0;background:var(--bg)}
.pick-h .link{text-transform:none;letter-spacing:0;font-size:.8rem}
.pick-rows{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));padding:2px 6px 8px}
.pick-rows label{flex-direction:row;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;color:var(--ink);font-weight:400;font-size:.9rem;cursor:pointer}
.pick-rows label:hover{background:var(--sunk)}
.pick-rows label:has(input:checked){background:var(--accent-soft)}
.combo-list{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px rgba(0,0,0,.22);padding:4px;overflow:auto}
.combo-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:.92rem}
.combo-opt .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-opt .r{white-space:nowrap;font-size:.8rem;color:var(--muted)}
.combo-opt.hot,.combo-opt:hover{background:var(--accent-soft)}
.combo-none{padding:10px;color:var(--muted);font-size:.9rem}
.ptabs{display:flex;flex-wrap:wrap;gap:6px}
.ptabs button{all:unset;cursor:pointer;white-space:nowrap;padding:6px 12px;border-radius:999px;font-size:.85rem;font-weight:600;color:var(--muted);background:var(--sunk)}
.ptabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.ptabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:.92rem;min-height:44px;display:flex;align-items:center;justify-content:center}
.pbtn:hover{border-color:var(--accent-line)}
.pbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbtn[aria-pressed="true"]::before{content:"✓";margin-right:6px}
.pbtn.all{border-style:dashed;color:var(--accent);font-size:.85rem}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips .c small{font-size:.75rem;margin-left:4px}
.freq{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:8px}
.task-note{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:.9rem}
.task-note .ico{color:var(--accent);margin-top:1px}
.rpt .box{display:inline-block;width:4mm;height:4mm;border:.6pt solid #000}
#gate{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 100% -10%,rgba(232,119,15,.20),transparent 45%),linear-gradient(135deg,#0E2818,#1F5C2C 55%,#3C8A48 92%)}
.gate-card{width:min(400px,100%);background:var(--surface);color:var(--ink);border-radius:16px;padding:26px;display:flex;flex-direction:column;gap:12px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.gate-card h1{font-size:1.5rem}
.gate-form{display:flex;flex-direction:column;gap:12px}
.gate-form .dlg-err{margin:0}
#sync{margin-left:6px}
#sync[data-state="saving"]{color:var(--muted)}
#sync[data-state="offline"],#sync[data-state="error"]{color:var(--bad);font-weight:600}
.plines{display:flex;flex-direction:column;gap:8px}
.pline{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) 80px 30px;gap:8px;align-items:center}
.preview-code{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.picked{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--bad);color:#fff}
.fab{display:none}
@media (max-width:980px){
  .fab{display:block;position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30}
  body:has(.split.has-sel) .fab,body:has(dialog[open]) .fab{display:none}
  .fab-btn{all:unset;cursor:pointer;width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:2rem;line-height:58px;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25);display:block}
  .fab-btn[aria-expanded=true]{transform:rotate(45deg)}
  .fab-menu{position:absolute;right:0;bottom:70px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  .fab-menu button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .fab-menu .ico{width:18px;height:18px;color:var(--accent)}
  #toast{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
}
#toast.undo{pointer-events:auto;display:flex;align-items:center;gap:14px}
#toast button{all:unset;cursor:pointer;font-weight:700;color:var(--accent-line);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){#toast,details.oroom > summary .chev{transition:none}}

/* ---------- Écrans moyens & téléphone ---------- */
@media (max-width:1180px){
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .syn-flow{grid-template-columns:repeat(2,minmax(0,1fr) 26px) minmax(0,1fr);row-gap:10px}
  .syn-flow > :nth-child(6){display:none}
}
@media (max-width:700px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pd-mbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:10px;z-index:5;margin:10px 0}
  .pd-mbar .btn{min-height:56px;font-size:1.1rem;font-weight:700;border-radius:14px;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .pd-mbar .big-out{background:var(--bad);border-color:var(--bad);color:#fff}
  .pd-mbar .big-in{background:var(--ok);border-color:var(--ok);color:#fff}
  .pd-stock .btn[data-act=move]{display:none}
  .pd-stock .btn{width:100%;justify-content:center}
  .prow{padding:12px 14px}
  .fill-bar{width:44px}
}
@media (max-width:980px){
  .m-only{display:inline-flex}
  .split.has-sel #list{display:none}

  .split,.cols{grid-template-columns:minmax(0,1fr)}
  .pane.detail{position:static;max-height:none}
  .opt{grid-template-columns:minmax(0,1fr)}
  .opt-nav{position:static;flex-direction:row;overflow-x:auto}
  .opt-nav button{white-space:nowrap}
}
@media (max-width:760px){
  .app{padding-top:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .hero{padding:18px 14px 12px;min-height:150px;border-radius:16px}
  .hero-art::after{background:linear-gradient(90deg,rgba(9,30,17,.85) 0%,rgba(9,30,17,.45) 50%,rgba(9,30,17,.1) 100%)}
  .hero h1{font-size:1.25rem}
  .hero p{display:none}
  .nav{width:100%;justify-content:space-between}
  .nav button{flex:1;flex-direction:column;justify-content:center;gap:2px;padding:6px 2px;font-size:.7rem;min-width:0}
  .nav .nl{white-space:nowrap}
  .gsearch kbd{display:none}
  h1{font-size:1.6rem}
  .search{max-width:none;flex-basis:100%}
  .page-head .tools{flex-basis:100%;justify-content:flex-start}
  .page-head{position:relative}
  .page-head .tools > .menu:last-child{position:absolute;top:0;right:0}
  .page-head .tools > .menu:last-child > .btn{min-height:38px}
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick .qa strong{font-size:.88rem}
  .list-bar{flex-wrap:nowrap;padding:8px 12px;gap:8px}
  .list-bar > .muted{flex:none;font-size:.78rem;max-width:30%}
  .list-bar .lb-r{gap:6px;flex-wrap:nowrap;margin-left:auto;min-width:0}
  .list-bar label{gap:0;font-size:0}
  .list-bar select{max-width:118px}
  .kstats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
  .kst{padding:8px}
  .kst b{font-size:1.15rem}
  .syn-flow{grid-template-columns:minmax(0,1fr)}
  .syn-flow > :nth-child(6){display:grid}
  .arrow{height:18px}
  .arrow svg{transform:rotate(90deg);width:18px;height:18px}
  .syn-side{grid-template-columns:minmax(0,1fr)}
  .syn-flow .zone{flex-direction:row;align-items:center;padding:10px}
  .syn-flow .zone .zc{margin:0 0 0 auto}
  .side-qr{grid-template-columns:minmax(0,1fr)}
  .grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}
  .mvtypes{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pline{grid-template-columns:minmax(0,1fr) 72px 30px}
  .pline .pl-lieu{grid-column:1/2;grid-row:2}
  .hide-sm{display:none}
  .d-actions .links{margin-left:0;width:100%}
  .otree{padding-left:18px}
}

/* ---------- Impression ---------- */
#print{display:none}
@page{size:A4;margin:14mm 14mm 16mm}
@page sheet{size:A4;margin:0}
@page roll{size:62mm 29mm;margin:0}
@media print{
  body.printing .app, body.printing #toast, body.printing dialog{display:none!important}
  body.printing{background:#fff;color:#000}
  body.printing #print{display:block}
}
#print{font-family:var(--f-body);color:#000}
.sheet{page:sheet;width:210mm;height:296mm;padding:15.1mm 7.2mm 0;display:grid;grid-template-columns:repeat(3,63.5mm);grid-auto-rows:38.1mm;column-gap:2.5mm;break-after:page;overflow:hidden}
.sheet:last-child,.roll:last-child{break-after:auto}
.lbl{display:grid;grid-template-columns:26mm minmax(0,1fr);gap:2.5mm;padding:3mm;align-items:center;overflow:hidden;height:38.1mm}
.lbl .qr{width:26mm;height:26mm}
.lbl-txt{display:flex;flex-direction:column;gap:.9mm;min-width:0}
.lbl-code{font-family:var(--f-mono);font-weight:600;font-size:10.5pt;line-height:1.15;background:#000;color:#fff;padding:.8mm 1.5mm;border-radius:1mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;white-space:nowrap;align-self:flex-start;max-width:100%;overflow:hidden}
.lbl-des{font-size:7.5pt;font-weight:600;line-height:1.2;max-height:9mm;overflow:hidden}
.lbl-room{font-size:7pt;line-height:1.2;font-family:var(--f-mono)}
.lbl-org{font-size:5.5pt;letter-spacing:.12em;text-transform:uppercase;color:#555}
.lbl.loc{grid-template-columns:minmax(0,1fr);align-content:center;gap:1.5mm}
.lbl.loc .lbl-code{white-space:normal;font-size:13pt;padding:1.5mm 2.5mm;background:#f5d66e;color:#000;border:.5mm solid #000}
.lbl.loc .lbl-room{font-family:var(--f-body);font-size:8pt}
.roll{page:roll;width:62mm;height:29mm;break-after:page;overflow:hidden}
.roll .lbl{height:29mm;grid-template-columns:23mm minmax(0,1fr);padding:2mm}
.roll .lbl .qr{width:23mm;height:23mm}
.roll .lbl.loc{grid-template-columns:minmax(0,1fr)}
.rpt{font-size:10pt;line-height:1.4}
.rpt-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5pt solid #000;padding-bottom:3mm;margin-bottom:5mm}
.rpt-org{font-size:8pt;letter-spacing:.15em;text-transform:uppercase}
.rpt h1{font-family:var(--f-display);font-size:20pt}
.rpt-num{text-align:right;font-family:var(--f-mono);font-size:11pt;font-weight:600}
.rpt h2{font-family:var(--f-display);font-size:11pt;text-transform:uppercase;letter-spacing:.08em;margin:5mm 0 1.5mm}
.rpt table{width:100%;border-collapse:collapse}
.rpt-grid th,.rpt-grid td,.rpt-tbl th,.rpt-tbl td{border:.6pt solid #000;padding:1.6mm 2.2mm;text-align:left;vertical-align:top}
.rpt-grid th,.rpt-tbl th{background:#eee;font-weight:600;width:28mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.rpt-tbl th{width:auto}
.rpt-tbl .n{text-align:right;font-family:var(--f-mono)}
.rpt-box{border:.6pt solid #000;padding:2.5mm;min-height:18mm;white-space:pre-wrap}
.rpt-box.tall{min-height:42mm}
.rpt-sign{display:grid;grid-template-columns:1fr 1fr;gap:8mm;margin-top:8mm;break-inside:avoid}
.rpt-sign span{font-weight:600}
.sigbox{border:.6pt solid #000;height:22mm;margin:1.5mm 0}
.rpt-sign small{font-size:7.5pt;color:#444}
.rpt-foot{margin-top:6mm;font-size:7.5pt;color:#444;border-top:.6pt solid #999;padding-top:2mm}
.mono{font-family:var(--f-mono)}
.ps-top{display:grid;grid-template-columns:minmax(0,1fr) 36mm;gap:6mm;align-items:start}
.ps-des{font-family:var(--f-display);font-size:15pt;font-weight:700;margin-bottom:3mm}
.ps-qr{text-align:center;font-size:8pt}
.ps-qr .qr{width:34mm;height:34mm;margin-bottom:1mm}
.lbl-prev{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;max-height:320px;overflow:auto;font-family:var(--f-body)}
.lbl-prev .sheet,.lbl-prev .roll{zoom:.55;background:#fff;color:#000;box-shadow:0 1px 6px rgba(0,0,0,.25);margin:0 auto 14px}
.lbl-prev .sheet{height:auto;min-height:120mm}
.lbl-prev .sheet > *{outline:1px dashed #c8c8c8}
</style>

function mergeStaff(d, list, full = false){
  let add = 0, upd = 0;

function parseCode(str){
  const t = String(str || '').trim().replace(/\s+/g, ' ');
  if (!t) return null;
  const m = t.match(/^([A-Za-z]{1,3}) ?(-?\d+) ?[.,] ?(\d+)(.*)$/);
  if (m){
    const rest = m[4].trim().replace(/^[\/›>]\s*/, '');
    if (!rest || /^[\/›>\s]/.test(m[4]) || !/^\S/.test(m[4]) || /[\/›>]/.test(rest)){
      const chemin = !rest ? [] : /[\/›>]/.test(m[4]) ? rest.split(/\s*[\/›>]\s*/).filter(Boolean) : rest.split(' ');

  const parts = t.split(/\s*[\/›>]\s*/).filter(Boolean);

}

function fourMatch(name, list){
  const c = fourCore(name); if (c.length < 3) return null;
  let best = null;
  for (const f of list){ const fc = fourCore(f); if (fc === c) return f; if (!best && c.length >= 4 && fc.startsWith(c)) best = f; }
  if (best) return best;
  const W = x => [...new Set(String(x).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 2))];
  const toks = W(name); if (!toks.length) return null;
  const hit = list.filter(f => { const ws = W(f); return toks.length === 1 ? (/^[A-Z0-9]{3,5}$/.test(String(name).trim()) && ws.includes(toks[0])) : toks.every(t => ws.some(w => w === t || (w.length >= 4 && t.length >= 4 && (w.startsWith(t) || t.startsWith(w))))); });

}

/* ---------------- Tâches (récurrentes ou ponctuelles) ----------------
   taches(id, titre, description, kksId, assign{type:'groupe'|'personne', v}, freq{n, unite:'jour'|'semaine'|'mois'|'an'|'once'}, prochaine, actif)
   Un rapport créé depuis une tâche porte tacheId ; quand il est « Terminé », la tâche passe à l'échéance suivante. */
const UNITES_T = {jour:['jour', 'jours'], semaine:['semaine', 'semaines'], mois:['mois', 'mois'], an:['an', 'ans']};
function addFreq(iso, n, unite){
  const d = new Date(iso + 'T12:00');
  if (unite === 'jour') d.setDate(d.getDate() + n);
  else if (unite === 'semaine') d.setDate(d.getDate() + 7 * n);
  else { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + (unite === 'an' ? 12 * n : n)); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); }
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
const freqLabel = f => f.unite === 'once' ? 'Une seule fois' : f.n === 1 ? ({jour:'Chaque jour', semaine:'Chaque semaine', mois:'Chaque mois', an:'Chaque année'})[f.unite] : `Tous les ${f.n} ${UNITES_T[f.unite][1]}`;
const assignLabel = a => !a || !a.v ? 'Non attribuée' : a.type === 'personne' ? persName(getPers(a.v) || {nom:'(supprimé)'}) : a.v;
const daysTo = iso => Math.round((new Date(iso + 'T12:00') - new Date(todayISO() + 'T12:00')) / 864e5);
function dueInfo(t){
  const n = daysTo(t.prochaine);
  if (n < 0) return {k:'retard', chip:`<span class="chip bad">En retard · ${-n} j</span>`};
  if (n === 0) return {k:'semaine', chip:'<span class="chip warn">Aujourd’hui</span>'};
  if (n <= 7) return {k:'semaine', chip:`<span class="chip warn">Dans ${n} j</span>`};
  return {k:'plus', chip:`<span class="chip off">${fmtD(t.prochaine)}</span>`};
}
const openRun = t => db.interventions.find(i => i.tacheId === t.id && !i.tacheFait);
const forWho = (t, pour) => {
  if (!pour) return true;
  const type = pour.slice(0, 1), v = pour.slice(2);
  if (type === 'g') return t.assign?.type === 'groupe' && t.assign.v === v;
  const p = getPers(v); return (t.assign?.type === 'personne' && t.assign.v === v) || (t.assign?.type === 'groupe' && !!p && t.assign.v === p.groupe);
};
function advanceTask(t, doneISO){
  t.derniere = doneISO;
  if (t.freq.unite === 'once'){ t.actif = false; return; }
  let n = t.prochaine;
  do { n = addFreq(n, t.freq.n, t.freq.unite); } while (n <= doneISO);
  t.prochaine = n;
}

}

function filteredPieces(){

  let rows = db.pieces.filter(p => S.arch.pieces ? p.arch : !p.arch).filter(p => !q || norm([p.ref, p.designation, p.fabricant, p.fournisseur, ...(p.fours || []), p.refFab, p.categorie, ...p.kks.map(id => getKks(id)?.code), ...p.stock.map(s => lieuCode(getLieu(s.lieuId)))].join(' ')).includes(q));
  if (S.lowOnly) rows = rows.filter(isLow);
  if (S.zeroOnly) rows = rows.filter(p => isOut(p));
  const idn = p => /^\d+$/.test(p.ref) ? +p.ref : Infinity;
  if (S.psort === 'alpha') return rows.sort((a, b) => coll.compare(a.designation, b.designation));
  if (S.psort === 'recent' || S.psort === 'old'){
    const last = new Map(); for (const m of db.mouvements) if (!last.has(m.pieceId) || m.date > last.get(m.pieceId)) last.set(m.pieceId, m.date);
    for (const h of db.histo){ const d = h.l && h.l[0] && h.l[0].d; if (d && (!last.has(h.id) || d > last.get(h.id))) last.set(h.id, d); }
    const k = p => last.get(p.id) || '';
    return S.psort === 'recent' ? rows.sort((a, b) => k(b).localeCompare(k(a)) || idn(b) - idn(a)) : rows.sort((a, b) => (k(a) || '9').localeCompare(k(b) || '9') || idn(a) - idn(b));
  }
  if (S.psort === 'iddesc') return rows.sort((a, b) => idn(b) - idn(a) || coll.compare(b.ref, a.ref));
  return rows.sort((a, b) => idn(a) - idn(b) || coll.compare(a.ref, b.ref));
}

/* ---------- Doublons : seulement des pièces strictement identiques (désignation, marque, réf. et notes), jamais fusionnées sans accord ---------- */
const dupKey = p => [p.designation, p.fabricant, p.refFab, p.notes].map(x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '')).join('|');
function dupGroups(){
  const ok = new Set(db.meta.notDup || []), m = new Map();
  for (const p of db.pieces){ if (!live(p)) continue; const k = dupKey(p); if (k.split('|')[0].length < 6) continue; if (!m.has(k)) m.set(k, []); m.get(k).push(p); }
  const idn = p => /^\d+$/.test(p.ref) ? +p.ref : Infinity;
  return [...m.values()].filter(g => g.length > 1).map(g => g.sort((a, b) => idn(a) - idn(b))).filter(g => !ok.has(g.map(p => p.id).sort().join('|')));
}
function mergePieces(keep, others){
  tx(() => {
    for (const o of others){
      for (const st of o.stock.filter(x => x.qte)){ if (getLieu(st.lieuId)){ const q = st.qte; addStock(o, st.lieuId, -q, 'Fusion doublon', `vers ID ${keep.ref}`); addStock(keep, st.lieuId, q, 'Fusion doublon', `de l’ID ${o.ref}`); } else { const k = keep.stock.find(x => x.lieuId === st.lieuId); if (k) k.qte = round(k.qte + st.qte); else keep.stock.push({...st}); st.qte = 0; } }
      o.stock = o.stock.filter(x => x.qte);
      for (const id of o.kks) if (!keep.kks.includes(id)) keep.kks.push(id);
      if (o.fours?.length) keep.fours = [...new Set([...(keep.fours || []), ...o.fours])];
      if (!keep.fournisseur && o.fournisseur) keep.fournisseur = o.fournisseur;
      keep.stockMin = Math.max(keep.stockMin || 0, o.stockMin || 0);
      for (const m of db.mouvements) if (m.pieceId === o.id && m.motif !== 'Fusion doublon') m.pieceId = keep.id;
      for (const i of db.interventions) for (const x of i.pieces) if (x.pieceId === o.id) x.pieceId = keep.id;
      const ho = db.histo.find(h => h.id === o.id);
      if (ho?.l?.length){ let hk = db.histo.find(h => h.id === keep.id); if (!hk){ hk = {id:keep.id, l:[]}; db.histo.push(hk); } hk.l = [...hk.l, ...ho.l.map(h => ({...h, t:`${h.t} (ID ${o.ref})`}))].sort((a, b) => String(b.d).localeCompare(String(a.d))); }
      o.arch = todayISO(); o.mergedInto = keep.ref;
    }
  });
}

/* Matériel des rapports CareOffice (« · 2 × Désignation ») relié à une pièce du stock quand la désignation est identique et unique */
const normDes = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const MAT_RX = /^·\s*(?:([\d.,]+)\s*×\s*)?(.+)$/;
let MATIDX = null;
function matIndex(){
  if (MATIDX && MATIDX.db === db && MATIDX.rev === REV) return MATIDX;
  const byDes = new Map(); for (const p of db.pieces){ if (!live(p)) continue; const k = normDes(p.designation); if (k.length < 5) continue; byDes.set(k, byDes.has(k) ? null : p); }
  const usedIn = new Map(), add = (pid, iid) => { if (!usedIn.has(pid)) usedIn.set(pid, new Set()); usedIn.get(pid).add(iid); };
  for (const i of db.interventions){ if (!live(i)) continue; for (const x of i.pieces || []) add(x.pieceId, i.id);
    const t = i.travaux || '', k = t.indexOf('Matériel utilisé'); if (k < 0) continue;
    for (const ln of t.slice(k).split('\n')){ const m = ln.match(MAT_RX); if (m){ const p = byDes.get(normDes(m[2])); if (p) add(p.id, i.id); } } }
  return MATIDX = {db, rev:REV, byDes, usedIn};
}
const matPiece = des => matIndex().byDes.get(normDes(des)) || null;
function travauxHTML(t){
  const k = t.indexOf('Matériel utilisé :'); const head = k >= 0 ? t.slice(0, k).trim() : t, mat = k >= 0 ? t.slice(k).split('\n').slice(1).filter(l => l.trim()) : [];
  return `${head ? `<p class="pre">${esc(head)}</p>` : ''}${mat.length ? `<div class="matl"><div class="matl-h">${icon('box')}Matériel utilisé</div>${mat.map(l => { const m = l.match(MAT_RX); const des = m ? m[2] : l.replace(/^·\s*/, ''), q = m && m[1] ? m[1] : '', p = matPiece(des);
    return `<div class="matl-r"><span class="q">${q ? esc(q) + ' ×' : ''}</span>${p ? `<button class="link" data-act="goto" data-view="pieces" data-id="${p.id}" title="Ouvrir la pièce ID ${esc(p.ref)}">${esc(des)}</button><span class="pid">ID ${esc(p.ref)}</span>` : `<span>${esc(des)}</span>`}</div>`; }).join('')}</div>` : ''}`;
}

/* Historique d'une pièce : mouvements TriFlow + historique repris de CareOffice */
function pieceHistory(p){
  const own = db.mouvements.filter(m => m.pieceId === p.id).map(m => ({date:m.date, qte:m.qte, motif:m.motif + (m.ref ? ' ' + m.ref : ''), lieu:getLieu(m.lieuId) ? lieuCode(getLieu(m.lieuId)) : '', who:m.who || ''}));
  const old = (get('histo', p.id)?.l || []).map(h => ({date:h.d, qte:h.q, neutral:!!h.n, motif:h.t, lieu:h.lieu || '', who:h.w || ''}));
  return [...own, ...old].sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

/* ---------- Emplacements (consultation) ---------- */
/* Arborescence d'une salle : chaque niveau du chemin devient un groupe, les emplacements sont des boutons. */
function lieuTree(ls, act, selId){
  const root = {kids:new Map(), lieu:null};
  for (const l of ls){ let n = root; for (const seg of pathOf(l)){ if (!n.kids.has(seg)) n.kids.set(seg, {kids:new Map(), lieu:null}); n = n.kids.get(seg); } n.lieu = l; }
  const slot = (label, l) => { const c = contentsOf(l.id).filter(x => x.qte > 0).length; return `<button class="slot ${c ? 'filled' : ''} ${selId === l.id ? 'sel' : ''}" data-act="${act}" data-id="${l.id}" title="${esc(lieuCode(l))}">${esc(label)}${c ? `<small>${c}</small>` : ''}</button>`; };
  const draw = (node, depth) => {
    const keys = [...node.kids.keys()].sort(coll.compare);
    const leaves = keys.filter(k => !node.kids.get(k).kids.size), groups = keys.filter(k => node.kids.get(k).kids.size);
    return (leaves.length ? `<div class="slots">${leaves.map(k => slot(k, node.kids.get(k).lieu)).join('')}</div>` : '')
      + groups.map(k => { const g = node.kids.get(k); return `<div class="rack"><div class="rack-head">${g.lieu ? slot(k, g.lieu) : esc(k)}</div>${draw(g, depth + 1)}</div>`; }).join('');
  };
  return (root.lieu ? `<div class="slots">${slot('Dans la salle', root.lieu)}</div>` : '') + draw(root, 0);
}

const kksRows = rows => `<div class="tbl-wrap"><table class="tbl"><tbody>${rows.map(k => `<tr data-act="select" data-id="${k.id}" class="${S.sel.kks === k.id ? 'sel' : ''}" tabindex="0"><td style="width:1%"><span class="kks">${esc(k.code)}</span></td><td>${esc(k.designation)}</td><td class="num">${k.aic ? `<span class="aic">${esc(k.aic)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
/* Regroupement des équipements d'un système : 1HHX10… (n° de sous-ensemble), puis par type (AA vannes, AP pompes…) */
const KKS_TYPES = {AA:'Vannes et robinetterie', AB:'Clapets et registres', AC:'Échangeurs de chaleur', AE:'Levage et rotation', AF:'Convoyeurs', AH:'Chauffage et refroidissement', AJ:'Broyage', AM:'Agitateurs et mélangeurs', AN:'Ventilateurs et compresseurs', AP:'Pompes', AT:'Filtres et nettoyage', AU:'Transmissions et réducteurs', BB:'Réservoirs et bâches', BN:'Éjecteurs et injecteurs', BP:'Diaphragmes', BR:'Tuyauteries et gaines', BS:'Silencieux', BZ:'Supports et divers', CE:'Mesures électriques', CF:'Mesures de débit', CG:'Mesures de position', CL:'Mesures de niveau', CP:'Mesures de pression', CQ:'Analyses', CS:'Mesures de vitesse', CT:'Mesures de température', CY:'Vibrations', CU:'Mesures combinées'};
const kksParts = code => { const m = String(code).replace(/\s+/g, '').match(/^(\d?)([A-Z]{3})(\d{2})([A-Z]{2})?/); return m ? {grp:m[1] + m[2] + m[3], unit:m[1], num:m[3], type:m[4] || ''} : {grp:'', unit:'', num:'', type:''}; };
const typeName = t => KKS_TYPES[t] || (t[0] === 'C' ? 'Mesures' : t[0] === 'E' ? 'Signaux et automatisme' : t ? 'Autres' : 'Ensemble');
function kksGroups(rows){
  const byCode = new Map(db.kks.map(k => [k.code.replace(/\s+/g, ''), k]));
  const groups = new Map(); for (const k of rows){ const g = kksParts(k.code).grp || '—'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(k); }
  return `<div class="kgroups">${[...groups].sort((a, b) => coll.compare(a[0].slice(1), b[0].slice(1)) || coll.compare(a[0], b[0])).map(([g, ks]) => {
    const own = byCode.get(g), p = kksParts(g), open = S.grpOpen.has(g) || groups.size === 1;
    const name = g === '—' ? 'Général' : own ? own.designation : (() => { const c = ks.filter(k => /\d$/.test(k.code) && kksParts(k.code).type !== 'BR'); return (c.length ? c : ks).map(k => k.designation).sort((x, y) => y.length - x.length)[0]; })()
    const line = p.unit === '1' ? 'Ligne 1' : p.unit === '2' ? 'Ligne 2' : p.unit === '0' ? 'Commun' : '';
    if (ks.length === 1 && !own) return `<div class="kgrp single">${kksRows(ks)}</div>`;
    const types = new Map(); for (const k of ks){ const t = kksParts(k.code).type; const n = typeName(t); if (!types.has(n)) types.set(n, []); types.get(n).push(k); }
    return `<div class="kgrp ${open ? 'open' : ''}"><button class="kgrp-h" data-act="kgrp" data-g="${esc(g)}" aria-expanded="${open}"><span class="chev ${open ? 'open' : ''}">${icon('chev')}</span><b class="code">${esc(g)}</b><span class="t">${esc(name)}</span>${line ? `<span class="chip">${line}</span>` : ''}<span class="cnt">${ks.length}</span></button>
      ${open ? [...types].map(([n, list]) => `${types.size > 1 ? `<div class="ktype">${esc(n)} <span class="muted">${list.length}</span></div>` : ''}${kksRows(list)}`).join('') : ''}</div>`;
  }).join('')}</div>`;
}
const kksSort = (a, b) => coll.compare(a.code.replace(/^\d+/, ''), b.code.replace(/^\d+/, '')) || coll.compare(a.code, b.code);

/* Relie chaque pièce aux fournisseurs dont le nom apparaît dans sa désignation ou ses notes (à appeler dans tx) */
function linkFournisseurs(){
  const nz = t => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  const SUF = /\b(ag|sa|gmbh|s\.?r\.?l\.?|sarl|sàrl|ltd|inc|co|kg|sas|bv|spa|ab|oy)\b\.?/gi;
  const long = new Map(), acro = new Map();
  for (const n of db.listes.fournisseurs){
    const c = nz(n).replace(SUF, '').replace(/[^a-z0-9&+ -]/g, ' ').replace(/\s+/g, ' ').trim();
    if (c.length >= 4){ if (!long.has(c)) long.set(c, n); }
    else { const a = n.replace(SUF, '').trim(); if (/^[A-Z0-9&]{3,4}$/.test(a) && !acro.has(a)) acro.set(a, n); }
  }
  const esc2 = x => x.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const RL = long.size ? new RegExp('(?<![a-z0-9])(' + [...long.keys()].sort((a, b) => b.length - a.length).map(esc2).join('|') + ')(?![a-z0-9])', 'g') : null;
  const RA = acro.size ? new RegExp('(?<![A-Za-z0-9])(' + [...acro.keys()].sort((a, b) => b.length - a.length).map(esc2).join('|') + ')(?![A-Za-z0-9])', 'g') : null;
  let np = 0;
  for (const p of db.pieces){
    const raw = `${p.designation || ''} ${p.notes || ''}`, txt = nz(raw), found = new Set();
    if (RL) for (const m of txt.matchAll(RL)) found.add(long.get(m[1]));
    if (RA) for (const m of raw.matchAll(RA)) found.add(acro.get(m[1]));
    const list = [...found].sort(coll.compare);
    if (list.length){ np++; if (!p.fournisseur) p.fournisseur = list[0]; }
    if (list.length || p.fours) p.fours = list;
  }
  return np;
}

        const hit = txt => { if (done || !txt) return; done = true; dd.close(); openCode(txt); };
        const tick = async () => {

            try {

            } catch(e){}

      } catch(e){ msg.textContent = (e.name === 'NotAllowedError' ? 'Accès à la caméra refusé. Autorisez-le dans le navigateur, ou tapez le code ci-dessous.' : e.message || 'Caméra indisponible.'); $('.scanbox', dd).hidden = true; }
    }});

function dialog({title, body, onSave, saveLabel = 'Enregistrer', wide = false, del = null, onOpen = null}){
  closeSearch();
  const d = document.createElement('dialog'); d.className = 'dlg' + (wide ? ' wide' : '');
  d.innerHTML = `<form novalidate><header><h2>${title}</h2><button type="button" class="icon-btn" data-close aria-label="Fermer">×</button></header>
    <div class="dlg-body">${body}</div><p class="dlg-err" hidden></p>
    <footer>${del ? `<button type="button" class="btn ${del.soft ? 'ghost' : 'danger-ghost'} left" data-del>${del.soft ? icon('archive') : ''}${del.label}</button>` : ''}<button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">${saveLabel}</button></footer></form>`;
  document.body.append(d);
  const f = $('form', d), err = $('.dlg-err', d);
  const fail = e => { err.textContent = e.message; err.hidden = false; err.scrollIntoView({block:'nearest'}); };
  $$('[data-close]', d).forEach(b => b.onclick = () => d.close());
  d.addEventListener('close', () => { d.remove(); if (CLOUD.dirty && !document.querySelector('dialog[open]')){ CLOUD.dirty = false; render(); } });
  f.addEventListener('submit', e => { e.preventDefault(); try { if (onSave(f, d) !== false) d.close(); } catch(x){ fail(x); } });
  if (del){
    const b = $('[data-del]', d); let armed = false;
    b.onclick = () => {
      if (!armed && !del.soft){ armed = true; b.textContent = 'Confirmer la suppression définitive'; b.classList.replace('danger-ghost', 'danger'); return; }
      try { del.run(); d.close(); } catch(x){ fail(x); }
    };
  }
  d.showModal(); onOpen && onOpen(f, d);
  const first = $('input:not([disabled]):not([type=hidden]):not([type=radio]),select,textarea', $('.dlg-body', d)); first && first.focus();
  return d;
}
const val = (f, n) => { const el = f.elements[n]; if (!el) return ''; return String(el.value ?? '').trim(); };

function expandNums(s){
  const out = [];
  for (const tok of String(s).split(/[,;\s]+/).filter(Boolean)){
    const m = tok.match(/^(\d+)-(\d+)$/);
    if (m){ const w = m[1].length, a = +m[1], b = +m[2]; if (b < a || b - a > 200) throw new Error(`Plage de niveaux invalide : ${tok}`); for (let i = a; i <= b; i++) out.push(String(i).padStart(w, '0')); }
    else if (/^\d+$/.test(tok)) out.push(tok); else throw new Error(`Niveau invalide : ${tok}`);
  }
  return out.length ? out : [''];
}
function expandLetters(s){
  const out = [];
  for (const tok of String(s).toUpperCase().split(/[,;\s]+/).filter(Boolean)){
    const m = tok.match(/^([A-Z])-([A-Z])$/);
    if (m){ for (let c = m[1].charCodeAt(0); c <= m[2].charCodeAt(0); c++) out.push(String.fromCharCode(c)); }
    else if (/^[A-Z]$/.test(tok)) out.push(tok); else throw new Error(`Bac invalide : ${tok}`);
  }
  return out.length ? out : [''];
}

/* Retrouve un emplacement à partir de son code, en créant le local et l'emplacement s'ils manquent (à appeler dans tx) */
function ensureLieu(codeTxt){
  const c = parseCode(codeTxt); if (!c) return null;
  const ex = findLieuExact(c); if (ex) return ex;
  let s = findSalle(c.local);
  if (!s){ s = c.libre ? {id:uid(), code:c.local, nom:'', ...(STATUT_RE.test(c.local) ? {statut:true} : {})} : {id:uid(), batiment:c.batiment, etage:c.etage, numero:c.numero, nom:''}; db.salles.push(s); }
  const l = {id:uid(), salleId:s.id, chemin:c.chemin, note:''}; db.lieux.push(l); return l;
}

/* ---------- Liste de choix avec recherche (remplace les listes du navigateur) ----------
   Clic ou focus : toute la liste s'affiche. On tape pour filtrer, flèches + Entrée pour choisir. */
function combo(input, {items, onPick, keep = true, max = 60}){
  const list = document.createElement('div'); list.className = 'combo-list'; list.hidden = true; list.setAttribute('role', 'listbox');
  input.closest('dialog').append(list);
  input.setAttribute('autocomplete', 'off'); input.setAttribute('role', 'combobox'); input.setAttribute('aria-expanded', 'false');
  let hits = [], act = 0, picked = input.dataset.label || input.value, pickedId = input.dataset.id || '';

  const draw = () => {
    const toks = norm(input.value === picked ? '' : input.value).split(/\s+/).filter(Boolean);
    hits = items().filter(it => toks.every(t => norm(it.search).includes(t))).slice(0, max);
    act = Math.min(act, Math.max(0, hits.length - 1));
    list.innerHTML = hits.length ? hits.map((it, i) => `<div class="combo-opt ${i === act ? 'hot' : ''}" role="option" data-i="${i}"><span class="t">${it.html}</span>${it.right ? `<span class="r">${it.right}</span>` : ''}</div>`).join('') : '<div class="combo-none">Aucun résultat</div>';
    list.hidden = false; input.setAttribute('aria-expanded', 'true'); place();
    list.querySelector('.hot')?.scrollIntoView({block:'nearest'});
  };
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); };
  const pick = it => { if (!it) return; if (keep){ input.value = picked = it.label; input.dataset.id = pickedId = it.id; } else { input.value = ''; picked = ''; } close(); onPick && onPick(it); };
  input.addEventListener('focus', () => { input.select(); act = 0; draw(); });
  input.addEventListener('click', () => { if (list.hidden){ act = 0; draw(); } });
  input.addEventListener('input', () => { act = 0; if (keep) input.dataset.id = ''; draw(); });
  input.addEventListener('keydown', e => {

      let add = 0, upd = 0, sys = 0;
      const byCode = new Map(db.kks.map(x => [x.code.toUpperCase(), x]));

/* Personnel : repris du Planning Tridel en ligne à l'ouverture (au plus une fois par jour, en silence).
   Sans connexion, la liste intégrée au fichier sert de base. */
async function syncPlanning(){
  const today = todayISO();
  if (db.meta.staffSync === today) return;
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 8000);
    const r = await fetch(`${PLANNING_URL}planning-${today.slice(0, 4)}.json`, {cache:'no-store', signal:ctl.signal}); clearTimeout(t);
    if (!r.ok) return;
    const j = await r.json(), fb = Object.fromEntries(PLANNING_STAFF);
    const list = (j.employes || []).map(e => { const nom = String(e.nom || '').trim(); const cat = String(e.categorie || '').trim(); return [nom, PLANNING_CAT[cat] || cat || fb[nom.toUpperCase()] || '']; }).filter(x => x[0]);
    if (list.length < 5) return;
    tx(() => { mergeStaff(db, list, true); db.meta.staffSync = today; });
    if (S.view === 'options') render();
  } catch(e){ /* hors ligne ou bloqué : on garde la liste actuelle */ }
}

  goto(d){ if (d.view !== S.view || S.sel[d.view] !== d.id){ S.back.push({view:S.view, sel:{...S.sel}, q:{...S.q}, sys:S.sys, sysExp:new Set(S.sysExp), psort:S.psort, plimit:S.plimit, y:window.scrollY, ls:$('#list')?.scrollTop || 0}); if (S.back.length > 20) S.back.shift(); } $('#gq').value = ''; go(d.view, d.id); },
  tab(d){ S.tab[S.view] = d.tab; fillDetail(); },
  zone(d){ S.zone = d.zone; S.q.kks = ''; go('kks'); },
  sys(d){ const c = d.sys || ''; S.q.kks = ''; S.sel.kks = null; S.sysAuto = null;
    if (c.length === 3 || c === '?'){ S.sys = c; if (c !== '?'){ S.sysExp.add(c[0]); S.sysExp.add(c.slice(0, 2)); } } else { S.sys = ''; S.sysExp.add(c); }
    if (S.view !== 'kks') go('kks'); else { fillList(); fillDetail(); scrollDetail(); } },
  'sys-sel'(d){ const c = d.sys || ''; S.q.kks = ''; S.sel.kks = null;
    if (c && c !== '?' && c.length < 3){ if (S.sysExp.has(c) && S.sys === c){ S.sysExp.delete(c); for (const x of [...S.sysExp]) if (x.startsWith(c)) S.sysExp.delete(x); } else { S.sysExp.add(c[0]); S.sysExp.add(c); } }
    if (c.length === 3){ S.sysExp.add(c[0]); S.sysExp.add(c.slice(0, 2)); }
    S.sys = c; S.sysAuto = null; if (S.view !== 'kks') go('kks'); else { fillList(); fillDetail(); scrollDetail(); } },
  kgrp(d){ S.grpOpen.has(d.g) ? S.grpOpen.delete(d.g) : S.grpOpen.add(d.g); fillDetail(); },
  'sys-tog'(d){ const c = d.sys; if (S.sysExp.has(c)){ S.sysExp.delete(c); for (const x of [...S.sysExp]) if (x.startsWith(c)) S.sysExp.delete(x); } else S.sysExp.add(c); fillList(); },
  'k-all'(d){ S.kAll = S.kAll === d.id ? null : d.id; fillDetail(); },
  'kks-back'(){ S.sel.kks = null; fillList(); fillDetail(); },
  'zone-clear'(){ S.zone = ''; render(); },
  opt(d){ S.opt = d.sec; go('options'); },
  'show-low'(){ S.lowOnly = true; S.zeroOnly = false; S.back = []; go('pieces'); },
  'show-zero'(){ S.zeroOnly = true; S.lowOnly = false; S.back = []; go('pieces'); },
  'toggle-zero'(){ S.zeroOnly = !S.zeroOnly; render(); },
  'toggle-low'(){ S.lowOnly = !S.lowOnly; render(); },
  'quick-move': d => moveDialog(null, d.type),
  'new-piece': () => pieceDialog(),
  'edit-piece': d => pieceDialog(getPiece(d.id)),
  move: d => moveDialog(getPiece(d.id), d.type),
  'add-place': d => addPlaceDialog(getPiece(d.id)),
  'hist-all'(d){ S.histAll = S.histAll === d.id ? null : d.id; fillDetail(); },
  'unlink-lieu'(d){ const p = getPiece(d.piece); tx(() => p.stock = p.stock.filter(s => !(s.lieuId === d.id && !s.qte))); fillList(); fillDetail(); toast('Emplacement retiré de la pièce'); },
  'unlink-kks'(d){ const p = getPiece(d.piece), k = getKks(d.id); tx(() => p.kks = p.kks.filter(id => id !== d.id)); fillList(); fillDetail(); toast(`Lien ${p.ref} ↔ ${k?.code || ''} retiré`); },
  'new-salle': () => salleDialog(),
  'edit-salle': d => salleDialog(getSalle(d.id)),
  'del-salle'(d){ const s = getSalle(d.id); if (!s) return; const ids = new Set(db.lieux.filter(l => l.salleId === s.id).map(l => l.id));
    const n = db.pieces.filter(p => p.stock.some(x => ids.has(x.lieuId) && x.qte > 0)).length;
    if (n){ toast(`Impossible : ${n} pièce(s) sont encore rangées dans ${salleCode(s)}. Déplacez-les d’abord.`); return; }
    confirmDialog(`Supprimer ${esc(salleCode(s))}`, `Le local ${esc(salleCode(s))}${ids.size ? ` et ses ${ids.size} emplacement(s) vides seront supprimés` : ' sera supprimé'}.`, 'Supprimer', () => {
      tx(() => { db.pieces.forEach(p => { if (p.stock.some(x => ids.has(x.lieuId))) p.stock = p.stock.filter(x => !ids.has(x.lieuId)); }); db.lieux = db.lieux.filter(l => !ids.has(l.id)); db.salles = db.salles.filter(x => x.id !== s.id); });
      render(); toast(`Local ${salleCode(s)} supprimé`); }); },
  'new-lieu': d => lieuDialog(null, d.salle),
  'edit-lieu': d => lieuDialog(getLieu(d.id)),
  'gen-series': d => seriesDialog(d.salle),
  'import-lieux': () => importLieuxDialog(),
  'labels-pick': () => pieceLabelsDialog(null),
  'labels-list': () => pieceLabelsDialog(filteredPieces().map(p => p.id)),
  'labels-one': d => pieceLabelsDialog([d.id]),
  'labels-here': d => pieceLabelsDialog(contentsOf(d.id).filter(x => x.qte > 0).map(x => x.p.id)),
  'labels-loc': d => locLabelsDialog(String(d.ids || '').split(',').filter(Boolean)),
  'new-int': d => interventionDialog(null, d.kks),
  'new-tache': d => tacheDialog(null, d.kks),
  'edit-tache': d => tacheDialog(get('taches', d.id)),
  'do-tache': d => interventionDialog(null, null, get('taches', d.id)),
  'print-taches': () => doPrint(tachesSheetHTML()),
  'toggle-tvue'(){ S.tvue = S.tvue === 'toutes' ? 'afaire' : 'toutes'; render(); },
  'edit-int': d => interventionDialog(getInt(d.id)),
  'print-int': d => doPrint(reportHTML(getInt(d.id))),
  'print-piece': d => doPrint(pieceSheetHTML(getPiece(d.id))),
  'pers-ints'(d){ const p = getPers(d.id); S.q.interventions = p.nom; S.statut = 'toutes'; S.ryear = null; S.arch.interventions = false; go('interventions'); },
  'new-kks': () => kksDialog(),
  'edit-kks': d => kksDialog(getKks(d.id)),
  'import-kks': () => importKksDialog(),
  'import-pieces': () => importPiecesDialog(),
  'import-four': () => importFourDialog(),
  'four-open'(d){ S.fourOpen = S.fourOpen === d.name ? null : d.name; const y = window.scrollY; render(); window.scrollTo(0, y); },
  'four-pieces'(d){ S.back.push({view:S.view, sel:{...S.sel}, q:{...S.q}, sys:S.sys, sysExp:new Set(S.sysExp), psort:S.psort, plimit:S.plimit, y:window.scrollY, ls:0}); S.q.pieces = d.name; S.lowOnly = false; S.zeroOnly = false; go('pieces'); },
  'link-four'(){ let np = 0; tx(() => { np = linkFournisseurs(); }); render(); toast(`${np} pièce(s) reliée(s) à au moins un fournisseur`); },
  'import-travaux': () => importTravauxDialog(),
  'int-all'(){ S.statut = 'toutes'; render(); },
  'new-pers': () => persDialog(),
  async logout(){ await CLOUD.sb.auth.signOut(); location.reload(); },
  'cloud-off'(){ confirmDialog('Revenir aux données du navigateur', 'Ce poste n’utilisera plus la base partagée. Les données de la base ne sont pas supprimées.', 'Revenir', () => { try { localStorage.removeItem('gmao-cloud'); } catch(e){} location.reload(); }); },
  'push-local'(){
    let d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
    if (!d) return toast('Aucune donnée locale trouvée.', 'bad');
    confirmDialog('Envoyer dans la base', `Le contenu de la base sera remplacé par les données de ce navigateur (${(d.pieces || []).length} pièces, ${(d.interventions || []).length} rapports, ${(d.taches || []).length} tâches).`, 'Envoyer', () => { db = migrate(d); db.meta.demo = false; save(); S.sel = {}; go('accueil'); toast('Données envoyées dans la base'); });
  },
  'new-four': () => fourDialog(),
  'edit-four': d => fourDialog(d.name),
  'edit-pers': d => persDialog(getPers(d.id)),
  'list-del'(d){ const v = db.listes[d.list][+d.i]; tx(() => db.listes[d.list].splice(+d.i, 1)); render(); toast(`« ${v} » retiré de la liste`); },
  'export-json'(){ download(`triflow-sauvegarde-${todayISO()}.json`, JSON.stringify(db, null, 1), 'application/json'); toast('Sauvegarde téléchargée'); },
  'import-json'(){ $('#file-json').value = ''; $('#file-json').click(); },
  'export-csv-stock': exportStock,
  'export-csv-int': exportInts,
  'export-csv-kks': exportKksLinks,
  'clear-demo'(){ confirmDialog('Effacer les exemples', 'Les pièces, emplacements, repères et rapports d’exemple seront supprimés. Le personnel du planning, les réglages et les listes sont conservés.', 'Effacer', () => { const r = db.reglages, li = db.listes, staff = db.personnes.filter(p => p.src === 'planning'); db = blank(); db.reglages = r; db.listes = li; db.personnes = staff; db.meta.staffV = 1; save(); S.sel = {}; go('accueil'); toast('Exemples effacés, personnel conservé'); }); },
  'clear-all'(){ confirmDialog('Tout effacer', 'Toutes les données de ce navigateur seront supprimées. Exportez d’abord une sauvegarde si vous voulez pouvoir les récupérer.', 'Tout effacer', () => { const r = db.reglages, li = db.listes; db = blank(); db.reglages = r; db.listes = li; save(); S.sel = {}; go('accueil'); toast('Données effacées'); }); },
  'load-demo'(){ confirmDialog('Recharger les exemples', 'Les données actuelles seront remplacées par les données d’exemple.', 'Remplacer', () => { const r = db.reglages; db = seed(); db.reglages = r; save(); S.sel = {}; go('accueil'); toast('Exemples rechargés'); }); }
};
const FORMS = {
  'link-kks'(f){
    const p = getPiece(f.dataset.piece), raw = val(f, 'kks'); if (!raw) return;
    const k = findKks(raw); if (!k) return toast('Repère inconnu : choisissez-le dans la liste proposée.', 'bad');
    if (p.kks.includes(k.id)) return toast(`${k.code} est déjà lié.`, 'bad');
    tx(() => p.kks.push(k.id)); fillList(); fillDetail(); $('#detail input[name=kks]')?.focus(); toast(`${p.ref} liée à ${k.code}`);
  },
  'link-piece'(f){
    const k = getKks(f.dataset.kks), raw = val(f, 'piece'); if (!raw) return;
    const p = findPiece(raw); if (!p) return toast('Pièce inconnue : choisissez-la dans la liste proposée.', 'bad');
    if (p.kks.includes(k.id)) return toast(`${p.ref} est déjà liée.`, 'bad');
    tx(() => p.kks.push(k.id)); fillList(); fillDetail(); $('#detail input[name=piece]')?.focus(); toast(`${p.ref} liée à ${k.code}`);
  },
  'list-add'(f){
    const key = f.dataset.list, v = val(f, 'v'); if (!v) return;
    if (db.listes[key].some(x => norm(x) === norm(v))) return toast('Déjà dans la liste.', 'bad');
    tx(() => db.listes[key].push(v)); render(); $(`form[data-list="${key}"] input`)?.focus(); toast(`« ${v} » ajouté`);
  },
  cloud(f){
    const url = val(f, 'url').replace(/\/+$/, ''), key = val(f, 'key');
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)) return toast('L’adresse doit ressembler à https://xxxx.supabase.co', 'bad');
    if (key.length < 30) return toast('La clé publique semble incomplète.', 'bad');
    try { localStorage.setItem('gmao-cloud', JSON.stringify({url, key})); } catch(e){ return toast('Enregistrement impossible dans ce navigateur.', 'bad'); }
    location.reload();
  },
  settings(f){
    const u = val(f, 'qrBase');
    if (u && !/^https?:\/\//i.test(u)) return toast('L’adresse doit commencer par http:// ou https://', 'bad');
    tx(() => { db.reglages.qrBase = u; db.reglages.labelFmt = val(f, 'labelFmt'); }); toast('Réglages enregistrés');
  }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.closest('dialog')) return;
  const fn = ACT[t.dataset.act]; if (!fn) return;
  e.preventDefault();
  if (t.dataset.act !== 'menu') closeMenus();
  try { fn(t.dataset, t); } catch(x){ toast(x.message, 'bad'); }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('tr[data-act]')){ e.preventDefault(); e.target.click(); }
  if (e.key === '/' && !e.target.closest('input,textarea,select,dialog')){ e.preventDefault(); const q = document.querySelector('.page-head input[type=search]'); if (q) q.focus(); }
});
document.addEventListener('submit', e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault();
  try { FORMS[f.dataset.form](f); } catch(x){ toast(x.message, 'bad'); }
});
document.addEventListener('input', e => {
  const k = e.target.dataset?.search; if (!k) return; S.q[k] = e.target.value; if (k === 'interventions') S.ryear = null;
  if (e.target.dataset.opt4){ render(); const i = document.querySelector('[data-opt4]'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }
  if (e.target.dataset.opt){ const q = norm(S.q.optkks); $('#opt-list').innerHTML = optKksTable(db.kks.filter(x => live(x) && (!q || norm(`${x.code} ${x.designation} ${x.aic || ''}`).includes(q))).sort(kksSort)); }
  else fillList();
});
document.addEventListener('change', e => {
  const c = e.target.dataset?.change; if (!c) return;
  if (c === 'lowOnly') S.lowOnly = !!e.target.value;
  if (c === 'statut') S.statut = e.target.value;
  if (c === 'psort'){ S.psort = e.target.value; fillList(); return; }
  if (c === 'plimit'){ S.plimit = +e.target.value; fillList(); return; }
  if (c === 'rlimit'){ S.rlimit = +e.target.value; fillList(); return; }
  if (c === 'zone') S.zone = e.target.value;
  if (c === 'pour'){ S.pour = e.target.value; }
  if (c === 'optGrp'){ S.optGrp = e.target.value; render(); return; }
  fillList();
});
$('#file-json').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let d; try { d = JSON.parse(r.result); } catch(x){ return toast('Ce fichier n’est pas une sauvegarde valide.', 'bad'); }
    if (!d || !Array.isArray(d.pieces) || !Array.isArray(d.lieux)) return toast('Ce fichier n’est pas une sauvegarde TriFlow.', 'bad');
    confirmDialog('Restaurer la sauvegarde', `Les données actuelles seront remplacées par celles du fichier « ${esc(file.name)} » (${d.pieces.length} pièces, ${d.lieux.length} emplacements, ${(d.interventions || []).length} rapports).`, 'Restaurer',
      () => { db = migrate(d); save(); S.sel = {}; go('accueil'); toast('Sauvegarde restaurée'); });
  };
  r.readAsText(file);
});

/* Lien direct (QR code) : #piece=P-00001, #lieu=E1.11%20C45%20A, #int=INT-2026-0001 */
function applyHash(){
  let h = ''; try { h = decodeURIComponent(location.hash.slice(1)); } catch(e){ return false; }
  const m = h.match(/^(lieu|piece|int)=(.+)$/); if (!m) return false;
  if (m[1] === 'piece'){ const p = findPiece(m[2]); if (p){ S.view = 'pieces'; S.sel.pieces = p.id; return true; } toast(`Pièce ${m[2]} introuvable.`, 'bad'); }
  if (m[1] === 'lieu'){ const l = findLieu(m[2]); if (l){ S.view = 'lieux'; S.sel.lieux = l.id; return true; } }
  if (m[1] === 'int'){ const i = db.interventions.find(x => x.num === m[2]); if (i){ S.view = 'interventions'; S.sel.interventions = i.id; return true; } }
  return false;
}
window.addEventListener('hashchange', () => { if (applyHash()) { render(); scrollDetail(); } });
hydrateIcons();
if (CLOUD.cfg().url){ bootCloud(); }
else { applyHash(); render(); syncPlanning(); }
</script>
